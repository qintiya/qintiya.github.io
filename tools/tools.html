<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AWDEV Tools — Developer & Islamic Utilities</title>
  <meta name="description" content="Free browser-based developer and Islamic tools from AWDEV.">
  <meta name="robots" content="index,follow">

  <link rel="canonical" href="https://awdev.eu.org/tools/tool.html">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="./style.css">

  <meta name="google-adsense-account" content="ca-pub-5407249785989200">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5407249785989200"
    crossorigin="anonymous"></script>

  <script defer src="./data.js"></script>
  <script defer src="./tools.js"></script>
  <script defer src="./developer-tools.js"></script>
  <script defer src="./islamic-tools.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="AWDEV home">
        <img src="/awdev.jpg" alt="AWDEV" width="40" height="40">
        <span>AW<span class="brand-accent">DEV</span></span>
      </a>

      <nav class="primary-nav" aria-label="Main navigation">
        <a href="./#developer-tools">Developer Tools</a>
        <a href="./#islamic-tools">Islamic Tools</a>
        <a href="./#learn">Learn</a>
      </nav>

      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main>
    <!-- Banner advertisement -->
    <div class="container ad-wrap" aria-label="Advertisement">
      <ins class="adsbygoogle ad-unit"
        style="display:block"
        data-ad-client="ca-pub-5407249785989200"
        data-ad-slot="3805519345"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    </div>

    <section class="section">
      <div class="container">
        <div class="section-heading">
          <div>
            <p class="eyebrow">AWDEV TOOLBOX</p>
            <h1>All Tools</h1>
            <p>Choose a tool, enter your information, and run it in this browser.</p>
          </div>
        </div>

        <label class="sr-only" for="toolSearch">Search tools</label>
        <input id="toolSearch" class="search-input" type="search"
          placeholder="Search tools…" autocomplete="off">

        <div class="filter-row" id="categoryFilters" aria-label="Filter tools"></div>
      </div>
    </section>

    <section class="section" id="developer-tools">
      <div class="container">
        <h2>Developer Tools</h2>
        <div class="tool-grid" id="developerToolGrid"></div>
      </div>
    </section>

    <section class="section section-tinted" id="islamic-tools">
      <div class="container">
        <h2>Islamic Tools</h2>
        <div class="tool-grid" id="islamicToolGrid"></div>
      </div>
    </section>

    <!-- Bottom advertisement -->
    <div class="container ad-wrap" aria-label="Advertisement">
      <ins class="adsbygoogle ad-unit"
        style="display:block"
        data-ad-format="fluid"
        data-ad-client="ca-pub-5407249785989200"
        data-ad-slot="6401168182"></ins>
    </div>
  </main>

  <dialog id="toolDialog" class="tool-dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow" id="dialogCategory">AWDEV TOOL</p>
        <h2 id="dialogTitle">Tool</h2>
      </div>
      <button id="dialogClose" class="icon-button" type="button" aria-label="Close dialog">✕</button>
    </div>
    <div id="dialogContent" class="dialog-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    window.addEventListener("load", function () {
      document.querySelectorAll(".adsbygoogle").forEach(function () {
        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({});
        } catch (error) {
          // Ad blockers or ad configuration may prevent loading.
        }
      });
    });
  </script>
</body>
</html>
